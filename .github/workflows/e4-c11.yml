name: MARP E4 C11 PROBE CI

# Isolated workflow for C11 PROBE (E4 MEASURE sub-component 3 of 3).
#
# Builds only E1 + C09/C10 API surface + C11 through engine/Makefile.c11, proves
# the E4 authority boundary (no E2-E7 linkage, no term/candidate/atom surface,
# no file name, clock, locale, or randomness in the library), runs the C11
# GoogleTest suite, verifies the committed evidence manifest, regenerates the
# evidence and requires it to be byte-identical, repeats the run independently
# and under ASan+UBSan, and checks that no earlier component's committed
# evidence moved.
#
# This workflow does NOT claim E4-G.  The integrated E4-G gate remains, and the
# C11 report says so.

on:
  push:
    branches: [h2-gates, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  c11-independence:
    name: C11 independence and E4 authority boundary (source level)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject E2-E7, harness, oracle, and Stage 1/2 engine includes in C11
        run: |-
          set -euo pipefail
          # Explicit file list, never a glob: `engine/src/e4` also holds C09 and
          # C10, and `include/mapr/e4` holds their headers.  C11 compiles C10's
          # Segment implementation for `where`, so the permitted set is E1
          # (bigint/sha256), C09, C10's headers, and C11 itself.
          C11_FILES="include/mapr/e4/e4_probe.hpp
          engine/src/e4/e4_probe.cpp"
          echo "Scanning the C11 library file list for forbidden includes..."
          if grep -nE '^[[:space:]]*#[[:space:]]*include[[:space:]]*[\"<](mapr/(e2|e3|e5|e6|e7)/|marp/harness/|marp/oracle|mapr/(container|encoder|decoder|pipeline|mau_translate|bitio|bitseq|dag|math_core|chunk_analyzer|crypto|dedup_index|deflate_frontend|hwprobe|noise_detector|profile|thread_pool))' $C11_FILES; then
            echo "FAIL: forbidden include found in the C11 library"
            exit 1
          fi
          if grep -nE '^[[:space:]]*#[[:space:]]*include[[:space:]]*\"mapr/' $C11_FILES \
             | grep -vE '\"mapr/(e1_bigint|e1_sha256|e1_types|e1_gear)\.hpp\"|\"mapr/e4/e4_(measure|segment|probe)\.hpp\"'; then
            echo "FAIL: C11 includes a mapr/ header outside {E1, C09, C10, itself}"
            exit 1
          fi
          echo "PASS: C11 includes only frozen E1, C09/C10, and the standard library"

      - name: Reject file, name, clock, locale, and randomness access in the C11 library
        run: |-
          set -euo pipefail
          C11_FILES="include/mapr/e4/e4_probe.hpp
          engine/src/e4/e4_probe.cpp"
          # Comments are stripped first: the header documents the *absence* of
          # each facility, and a documentation sentence is not a dependency.
          # The library may not consult a file name or a path.
          if sed -E 's://.*::' $C11_FILES \
             | grep -nE '(std::filesystem|fstream|std::chrono|std::time|gmtime|localtime|getenv|std::locale|setlocale|std::random_device|rand\(|srand|getpid|extension\(|filename\(|\.path\()'; then
            echo "FAIL: environment, clock, locale, randomness, or file-name access in C11"
            exit 1
          fi
          echo "PASS: C11 library reads bytes only"

      - name: Reject term, candidate, and index surfaces in C11 (E4-I6)
        run: |-
          set -euo pipefail
          # E4-I6: C11 may not emit terms/candidates/atoms/nodes, maintain a
          # cross-segment dictionary or global index, classify atoms, or branch
          # on a file name.  Local per-call frequency tables of a single probe
          # statistic are accumulators of the §4.2/§4.7 formulas, not
          # dictionaries: they live and die inside one probe() call.
          if sed -E 's://.*::' include/mapr/e4/e4_probe.hpp engine/src/e4/e4_probe.cpp \
             | grep -nE '(struct[[:space:]]+Ir|class[[:space:]]+Dag|struct[[:space:]]+Candidate|struct[[:space:]]+Atom|discover|induce|classify|global[[:space:]]+dict|cross-segment)'; then
            echo "FAIL: term- or index-shaped token in the C11 surface"
            exit 1
          fi
          if grep -nE '^[[:space:]]*(MeasureResult|Result)<(Ir|Dag|Candidate|Atom)>' \
              include/mapr/e4/e4_probe.hpp; then
            echo "FAIL: a C11 entry point returns a term-shaped type"
            exit 1
          fi
          echo "PASS: C11 returns observations only"

      - name: Reject non-C++ artefacts under C11 paths
        run: |-
          set -euo pipefail
          if find include/mapr/e4/e4_probe.hpp engine/src/e4/e4_probe.cpp \
                    engine/src/e4/c11_gate.cpp engine/tests/e4/e4_c11_probe_test.cpp \
                    engine/Makefile.c11 \
                    -type f \( -name '*.py' -o -name '*.sh' \) 2>/dev/null | grep -q .; then
            echo "FAIL: script file found under a C11 path"
            exit 1
          fi
          echo "PASS: C++20 only under C11 paths"

      - name: Confirm every earlier evidence manifest still verifies
        run: |-
          set -euo pipefail
          # Enumerated from the tree so a component directory added later is
          # covered automatically; C11's own manifest is checked in the build job.
          count=0
          for sums in specs_and_reports/v2/evidence/*/SHA256SUMS; do
            case "$sums" in
              */C11/SHA256SUMS) continue ;;
            esac
            sha256sum -c "$sums"
            echo "OK: $sums"
            count=$((count + 1))
          done
          if [ "$count" -lt 13 ]; then
            echo "FAIL: expected at least 13 prior evidence manifests, found $count"
            exit 1
          fi
          echo "PASS: $count prior evidence manifests still verify (no regression)"

  build-test-evidence:
    name: C11 build, tests, sanitizers, evidence
    runs-on: ubuntu-latest
    needs: [c11-independence]
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify commit
        run: |-
          set -euo pipefail
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Branch: ${{ github.ref_name }}"

      - name: Install dependencies (C++20 toolchain + GoogleTest)
        run: |-
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential g++ cmake pkg-config
          cd /tmp
          git clone --depth 1 https://github.com/google/googletest.git
          cd googletest
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j4
          sudo make install
          sudo ldconfig
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/googletest.conf
          sudo ldconfig

      - name: Record toolchain
        run: |-
          set -euo pipefail
          g++ --version | head -1
          echo "::notice::compiler=$(g++ -dumpfullversion -dumpversion)"

      - name: Build C11 (strict -Werror, -O2)
        run: |-
          # Actions runs `run:` blocks with `bash -e`.  Turn that off so a failed
          # make reaches the diagnostic relay instead of aborting the step.
          set +e
          set -uo pipefail
          echo "::notice::toolchain: $(make --version | head -1); $(g++ --version | head -1)"
          cd engine
          make -f Makefile.c11 c11-clean
          make -f Makefile.c11 c11-all -j4 2>&1 | tee /tmp/c11_build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # A build failure must be readable from the check-run annotations:
            # the CI log archive is not always reachable from a reviewing client,
            # while the annotation API always is.
            echo "::error::C11 build failed (make exit $rc)"
            n=0
            while IFS= read -r diag; do
              [ -n "$diag" ] || continue
              echo "::error::$diag"
              n=$((n + 1))
              [ "$n" -lt 40 ] || break
            done < /tmp/c11_build.log
            exit "$rc"
          fi
          echo "PASS: C11 built warning-free under -Werror"

      - name: Verify C11 binary isolation (source grep + nm on built objects)
        run: |-
          set -euo pipefail
          cd engine
          make -f Makefile.c11 c11-isolation
          echo "Defined symbols in the C11 library object:"
          nm -C obj/c11/e4/e4_probe.o | grep -E ' [TtWw] ' | sort
          echo "Checking the C11 test binary does not link E2-E7 or Stage 1/2 code..."
          # Observation and probe() are C11's own surface and must be present;
          # the forbidden set is the term/harness/container machinery.
          if nm -C bin/e4_c11_tests | grep -E 'marp::v2::(Ir|Dag|Candidate|Atom|discover|induce|select|encode|decode)\b|marp::harness::|mapr::(ContainerReader|ContainerWriter|Encoder|Decoder)'; then
            echo "FAIL: forbidden symbol linked into the C11 test binary"
            exit 1
          fi
          echo "PASS: binary isolation verified"

      - name: Snapshot committed evidence and verify manifest
        run: |-
          set -euo pipefail
          cp specs_and_reports/v2/gates/C11-PROBE.tsv /tmp/committed-C11-PROBE.tsv
          cp specs_and_reports/v2/logs/C11-PROBE.log /tmp/committed-C11-PROBE.log
          cp specs_and_reports/v2/evidence/C11/SHA256SUMS /tmp/committed-C11-SHA256SUMS
          sha256sum -c specs_and_reports/v2/evidence/C11/SHA256SUMS
          ./engine/bin/c11_gate --root . --verify
          echo "PASS: committed C11 evidence manifest verified before regeneration"

      - name: Run C11 GoogleTest suite
        run: |-
          set -euo pipefail
          cd engine
          ./bin/e4_c11_tests --gtest_color=no

      - name: Evidence validation (schema, verdicts, required checks, log hygiene)
        run: |-
          set +e
          set -uo pipefail
          TSV=specs_and_reports/v2/gates/C11-PROBE.tsv
          LOG=specs_and_reports/v2/logs/C11-PROBE.log
          SUMS=specs_and_reports/v2/evidence/C11/SHA256SUMS
          out=$( (
            set -euo pipefail
            if [ ! -s "$TSV" ] || [ ! -s "$LOG" ]; then
              echo "FAIL: C11 evidence is empty"
              exit 1
            fi
            rows=$(($(wc -l < "$TSV") - 1))
            if [ "$rows" -lt 500 ]; then
              echo "FAIL: expected at least 500 evidence rows, found $rows"
              exit 1
            fi
            fails=$(grep -cP '\tFAIL\t' "$TSV" || true)
            blocked=$(grep -cP '\tBLOCKED\t' "$TSV" || true)
            if [ "$fails" -ne 0 ] || [ "$blocked" -ne 0 ]; then
              echo "FAIL: $fails FAIL and $blocked BLOCKED rows in the C11 evidence"
              grep -P '\t(FAIL|BLOCKED)\t' "$TSV" | head -20
              exit 1
            fi
            passes=$(grep -cP '\tPASS\t' "$TSV" || true)
            if [ "$passes" -ne "$rows" ]; then
              echo "FAIL: $passes PASS rows for $rows rows"
              exit 1
            fi
            # Every required check group must be present: a missing group is a
            # silently weakened gate, which is worse than a failing one.  The
            # membership test is an awk decision on the file, not `grep -q` on
            # a `cut` pipeline: `grep -q` exits at its first match and `pipefail`
            # would then see SIGPIPE from `cut`, spuriously reporting a missing
            # group on a large TSV.
            for prefix in \
              c11.constants.section47 c11.constants.section45 c11.constants.section48 \
              c11.constants.section49 c11.constants.section410 c11.constants.limits \
              c11.fixed.ilog2.kat c11.fixed.ilog2.reference c11.fixed.entropy.kat \
              c11.fixed.h0.reference \
              c11.probe.h0.reference c11.probe.h1.reference c11.probe.h2.reference \
              c11.probe.runs.reference c11.probe.period.reference \
              c11.probe.period.fullcheck c11.probe.period.minimality \
              c11.probe.period.verify_api c11.probe.repeat16.reference \
              c11.probe.skew.reference c11.probe.bitcomplexity.reference \
              c11.probe.affine.reference c11.probe.quadratic.reference \
              c11.probe.stride.reference c11.probe.changepoint.reference \
              c11.probe.run c11.fields.discipline c11.reproducibility.rerun \
              c11.sampling.path c11.sampling.offsets c11.sampling.threshold \
              c11.effort.budget c11.effort.values c11.locality.mutation \
              c11.merge.order c11.verify_period.api c11.errors.invalid c11.errors.io \
              c11.isolation.includes c11.isolation.environment c11.isolation.no_terms ; do
              if ! awk -F'\t' -v p="$prefix" '$1 == p { found = 1 } END { exit !found }' "$TSV"; then
                echo "FAIL: required check group missing from the C11 evidence: $prefix"
                exit 1
              fi
            done
            # No empty column anywhere: an evidence row with a blank expected or
            # actual value is not evidence.  Same reasoning as above: the awk
            # process decides on its own exit status rather than piping into
            # `grep -q`.
            if awk -F'\t' 'NF != 8 || $1 == "" || $4 == "" || $5 == "" || $6 == "" { print; bad = 1 } END { exit !bad }' "$TSV" > /tmp/c11_bad_rows.txt; then
              echo "FAIL: a C11 evidence row has a missing or empty column"
              head -20 /tmp/c11_bad_rows.txt
              exit 1
            fi
            # Log hygiene: the log is the artefact a reviewer reads, so it may not
            # carry a host name, a date, a compiler version, a pid, a timing, or an
            # absolute path — any of those would make the evidence unreproducible.
            if grep -niE '(hostname|^host:|^date|^compiler|^pid|elapsed|seconds|wall clock|user@|/home/|/tmp/)' "$LOG"; then
              echo "FAIL: environment-dependent text in the C11 log"
              exit 1
            fi
            log_rows=$(grep -cE '^\[(c11\.|summary:)' "$LOG" || true)
            if [ "$log_rows" -lt 1000 ]; then
              echo "FAIL: expected at least 1000 log rows, found $log_rows"
              exit 1
            fi
            summary_rows=$(grep -c '^\[summary:' "$LOG" || true)
            if [ "$summary_rows" -lt 35 ]; then
              echo "FAIL: expected a summary block of at least 35 checks, found $summary_rows"
              exit 1
            fi
            # The log must record the observation inventory per fixture: a
            # reviewer reads those rows directly.
            if [ "$(grep -c 'sha256=' "$LOG" || true)" -lt 35 ]; then
              echo "FAIL: fewer than 35 fixture digests recorded in the C11 log"
              exit 1
            fi
            sha256sum -c "$SUMS"
            echo "PASS: C11 evidence schema, verdicts, required checks, and log hygiene verified"
            exit 0
            2>&1 ) )
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::C11 evidence validation failed (exit $rc)"
            n=0
            while IFS= read -r diag; do
              [ -n "$diag" ] || continue
              case "$diag" in
                PASS:*) ;;
                *) echo "::error::$diag"; n=$((n + 1)); [ "$n" -lt 30 ] || break ;;
              esac
            done < <(printf '%s\n' "$out" | tail -n 30)
            exit "$rc"
          fi

      - name: Determinism (independent repeat run reproduces byte-identical evidence)
        run: |-
          set -euo pipefail
          ./engine/bin/c11_gate --root . --out-root /tmp/c11_repeat
          diff -u /tmp/committed-C11-PROBE.tsv /tmp/c11_repeat/specs_and_reports/v2/gates/C11-PROBE.tsv
          diff -u /tmp/committed-C11-PROBE.log /tmp/c11_repeat/specs_and_reports/v2/logs/C11-PROBE.log
          diff -u /tmp/committed-C11-SHA256SUMS /tmp/c11_repeat/specs_and_reports/v2/evidence/C11/SHA256SUMS
          rm -rf /tmp/c11_repeat
          echo "PASS: repeat run produced byte-identical C11 evidence"

      - name: AddressSanitizer + UBSan C11 unit tests and gate run
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |-
          set -euo pipefail
          cd engine
          make -f Makefile.c11 c11-test-san -j4
          ./bin/c11_gate_san --root .. --out-root /tmp/c11_san_repro
          diff -u /tmp/committed-C11-PROBE.tsv /tmp/c11_san_repro/specs_and_reports/v2/gates/C11-PROBE.tsv
          diff -u /tmp/committed-C11-PROBE.log /tmp/c11_san_repro/specs_and_reports/v2/logs/C11-PROBE.log
          diff -u /tmp/committed-C11-SHA256SUMS /tmp/c11_san_repro/specs_and_reports/v2/evidence/C11/SHA256SUMS
          rm -rf /tmp/c11_san_repro
          echo "PASS: ASan+UBSan unit tests and gate run reproduced committed C11 evidence"

      - name: No-regression check (frozen E1-E4 and earlier evidence untouched)
        run: |-
          set -euo pipefail
          # C11 is additive: it touches only its own new paths plus the LEDGER
          # and its own report.  Every frozen header, implementation, and
          # earlier evidence artefact must be byte-identical to the base commit.
          if ! git diff --quiet -- include/mapr/e1_bigint.hpp \
                include/mapr/e1_crc32.hpp \
                include/mapr/e1_gear.hpp \
                include/mapr/e1_length.hpp \
                include/mapr/e1_sha256.hpp \
                include/mapr/e1_types.hpp \
                include/mapr/e2 \
                include/mapr/e3 \
                include/mapr/e4/e4_measure.hpp \
                include/mapr/e4/e4_segment.hpp \
                engine/src/e1_bigint.cpp \
                engine/src/e1_crc32.cpp \
                engine/src/e1_gear.cpp \
                engine/src/e1_length.cpp \
                engine/src/e1_sha256.cpp \
                engine/src/e2 engine/src/e3 harness \
                engine/src/e4/e4_provenance.cpp \
                engine/src/e4/e4_segment.cpp \
                engine/src/e4/c10_gate.cpp \
                engine/tests/e4/e4_c10_segment_test.cpp \
                engine/Makefile.c09 \
                engine/Makefile.c10 \
                specs_and_reports/v2/gates/E0-G.tsv \
                specs_and_reports/v2/gates/E1-G.tsv \
                specs_and_reports/v2/gates/H1-FIXTURES.tsv \
                specs_and_reports/v2/gates/H3-ORACLE.tsv \
                specs_and_reports/v2/gates/H4-FUZZ.tsv \
                specs_and_reports/v2/gates/C03-TERM.tsv \
                specs_and_reports/v2/gates/C04-CANON.tsv \
                specs_and_reports/v2/gates/C05-EVAL.tsv \
                specs_and_reports/v2/gates/C06-DAG.tsv \
                specs_and_reports/v2/gates/C07-WIRE.tsv \
                specs_and_reports/v2/gates/C08-LEGACY.tsv \
                specs_and_reports/v2/gates/E2-G.tsv \
                specs_and_reports/v2/gates/E3-G.tsv \
                specs_and_reports/v2/gates/C09-PROVENANCE.tsv \
                specs_and_reports/v2/gates/C10-SEGMENT.tsv \
                specs_and_reports/v2/logs/C09-PROVENANCE.log \
                specs_and_reports/v2/logs/C10-SEGMENT.log; then
            echo "FAIL: frozen component or earlier evidence modified"
            exit 1
          fi
          # C09 and C10 must still be green at this commit, their manifests must
          # verify, and every earlier manifest must verify too.
          cd engine
          make -f Makefile.c09 c09-all -j4 > /tmp/c09_rebuild.log 2>&1 || {
            echo "::error::C09 no longer builds at this commit"
            tail -20 /tmp/c09_rebuild.log
            exit 1
          }
          ./bin/e4_c09_tests --gtest_color=no | tail -3
          ./bin/c09_gate --root .. --verify
          make -f Makefile.c10 c10-all -j4 > /tmp/c10_rebuild.log 2>&1 || {
            echo "::error::C10 no longer builds at this commit"
            tail -20 /tmp/c10_rebuild.log
            exit 1
          }
          ./bin/e4_c10_tests --gtest_color=no | tail -3
          ./bin/c10_gate --root .. --verify
          cd ..
          for sums in specs_and_reports/v2/evidence/*/SHA256SUMS; do
            sha256sum -c "$sums" > /dev/null
          done
          echo "PASS: C09/C10 still green, all evidence manifests verify, frozen components untouched"

      - name: Upload C11 evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-c11-evidence
          path: |
            specs_and_reports/v2/gates/C11-PROBE.tsv
            specs_and_reports/v2/logs/C11-PROBE.log
            specs_and_reports/v2/evidence/C11/SHA256SUMS
          retention-days: 30
